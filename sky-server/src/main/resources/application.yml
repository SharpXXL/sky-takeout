server:
  port: 8080

spring:
  profiles:
    active: dev # 激活开发环境
  main:
    allow-circular-references: true # Spring Boot 3/4 默认禁用循环引用，保持开启以兼容老代码
  datasource:
    # 优雅点：直接在这里定义好 URL 模板，数值从子配置文件或自定义属性中读取
    driver-class-name: ${sky.datasource.driver-class-name}
    url: jdbc:mysql://localhost:3306/sky_take_out?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰转换

logging:
  level:
    com.sky.mapper: debug
    com.sky.service: info
    com.sky.controller: info